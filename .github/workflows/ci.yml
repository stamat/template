name: CI

# In this repository the scripts below are stubs that exit 1, so CI runs only on
# demand. Uncomment the two triggers the moment script/test does something real.
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  # pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      # A matrix is worth having wherever the project claims to run: two runtime
      # versions catch deprecations early, and windows-latest catches the path
      # bugs that never reproduce on a Mac. Drop what does not apply.
      matrix:
        os: [ubuntu-latest]
        # version: ["3.13", "3.14"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The only language-specific step. Pick one, delete the rest — everything
      # below it is the same in every repository, because it only calls scripts.
      #
      # - uses: actions/setup-node@v6
      #   with: { node-version: "${{ matrix.version }}", cache: npm }
      # - uses: actions/setup-python@v6
      #   with: { python-version: "${{ matrix.version }}", cache: pip }
      # - uses: ruby/setup-ruby@v1
      #   with: { ruby-version: "${{ matrix.version }}", bundler-cache: true }
      # - uses: shivammathur/setup-php@v2
      #   with: { php-version: "${{ matrix.version }}", coverage: none }

      - name: Install dependencies
        run: script/bootstrap

      - name: Lint
        run: script/lint

      - name: Test
        run: script/test

      - name: Build
        run: script/build
